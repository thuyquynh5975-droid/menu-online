<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>An Home Made - Menu</title>

<style>
*{box-sizing: border-box;
    margin: 0;
    padding: 0;}

body{font-family: Arial, sans-serif;
    background: #fffaf3;
    color: #4b3528;
    padding-bottom: 40px;}

.header ( background: #f3d6b3;
    text-align: center;
    padding: 28px 15px 22px;
    border-bottom-left-radius: 30px;
    border-bottom-right-radius: 30px;}

.logo {font-size: 32px;
    font-weight: bold;
    color: #7a4b2f;
    margin-bottom: 8px;}

.slogan {font-size: 15px;
    color: #795548;}

.container{ width: 92%;
    max-width: 600px;
    margin: 25px auto;}

.section-title {text-align: center;
    font-size: 23px;
    color: #7a4b2f;
    margin-bottom: 18px;}

.menu-item { background: white;
    border-radius: 18px;
    padding: 17px;
    margin-bottom: 14px;
    box-shadow: 0 4px 12px rgba(100, 70, 40, 0.10);
    display: flex;
    justify-content: space-between;
    align-items: center;}

.item-name { font-size: 17px;
    font-weight: bold;}
 .item-price {color: #c46b3c;
    font-size: 17px;
    font-weight: bold;
    white-space: nowrap;}

.topping-box  background: #fff;
    border-radius: 18px;
    padding: 18px;
    margin-top: 22px;
    box-shadow: 0 4px 12px rgba(100, 70, 40, 0.10);}

.topping-title {font-size: 19px;
    font-weight: bold;
    color: #7a4b2f;
    margin-bottom: 12px;}
.topping {display: flex;
    justify-content: space-between;
    padding: 9px 0;
    border-bottom: 1px solid #eee;}

.topping:last-child { border-bottom: none;}

.order-button {display: block;
    width: 100%;
    margin-top: 25px;
    padding: 17px;
    border: none;
    border-radius: 18px;
    background: #7a9b59;
    color: white;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    text-align: center;}

.order-button:hover {background: #668747;}
.note { text-align: center;
    margin-top: 18px;
    font-size: 13px;
    color: #8b7568}
.footer {text-align: center;
    margin-top: 30px;
    color: #8b7568;
    font-size: 13px;}

/* FORM ĐẶT MÓN */

.modal {display: none;
    position: fixed;
    z-index: 1000;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.45);
    overflow-y: auto;}

.modal-content {background: #fffaf3;
    width: 92%;
    max-width: 500px;
    margin: 30px auto;
    padding: 24px;
    border-radius: 22px;
    position: relative;}

.close {position: absolute;
    right: 18px;
    top: 12px;
    font-size: 30px;
    color: #795548;
    cursor: pointer;}

.modal-title { text-align: center;
    color: #7a4b2f;
    font-size: 24px;
    margin-bottom: 20px;}

label {display: block;
    margin-top: 13px;
    margin-bottom: 6px;
    font-weight: bold;}

input,
select,
textarea {width: 100%;
    padding: 12px;
    border: 1px solid #ddc8b5;
    border-radius: 12px;
    font-size: 15px;
    background: white;}

textarea {min-height: 80px;
    resize: vertical;}
.submit-button {width: 100%;
    margin-top: 20px;
    padding: 15px;
    border: none;
    border-radius: 15px;
    background: #7a9b59;
    color: white;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;}
</style>
</head>

<body>

<header class="header">
    <div class="logo"> An Home Made</div>
    <div class="slogan">Nước ngon nhà làm – Tươi mỗi ngày </div>
</header>

<main class="container">

    <h2 class="section-title"> MENU NƯỚC</h2>

    <div class="menu-item">
        <span class="item-name"> Trà Tắc</span>
        <span class="item-price">15K</span>
    </div>

    <div class="menu-item">
        <span class="item-name"> Trà Chanh</span>
        <span class="item-price">15K</span>
    </div>

    <div class="menu-item">
        <span class="item-name"> Trà Mận</span>
        <span class="item-price">22K</span>
    </div>

    <div class="menu-item">
        <span class="item-name"> Trà Hoa Quả Nhiệt Đới</span>
        <span class="item-price">25K</span>
    </div>

    <div class="menu-item">
        <span class="item-name"> Chanh Xí Muội</span>
        <span class="item-price">20K</span>
    </div>

    <div class="menu-item">
        <span class="item-name"> Rau Má Tươi</span>
        <span class="item-price">20K</span>
    </div>

    <div class="topping-box">
        <div class="topping-title"> TOPPING</div>

        <div class="topping">
            <span> Thạch dừa</span>
            <strong>+5K</strong>
        </div>

        <div class="topping">
            <span> Trân châu</span>
            <strong>+5K</strong>
        </div>
    </div>

    <button class="order-button" onclick="openOrder()">
        ĐẶT MÓN NGAY
    </button>

    <div class="note">
         Cảm ơn bạn đã ủng hộ An Home Made!
    </div>

</main>

<footer class="footer">
    © 2026 An Home Made
</footer>


<!-- FORM ĐẶT MÓN -->

<div id="orderModal" class="modal">

    <div class="modal-content">

        <span class="close" onclick="closeOrder()">&times;</span>

        <h2 class="modal-title"> Đặt món</h2>

        <form onsubmit="submitOrder(event)">

            <label for="name">Tên của bạn</label>
            <input
                type="text"
                id="name"
                placeholder="Nhập tên"
                required
            >

            <label for="phone">Số điện thoại</label>
            <input
                type="tel"
                id="phone"
                placeholder="Nhập số điện thoại"
                required
            >

            <label for="drink">Chọn món</label>
            <select id="drink" required>
                <option value="">-- Chọn món --</option>
                <option>Trà Tắc - 15K</option>
                <option>Trà Chanh - 15K</option>
                <option>Trà Mận - 22K</option>
                <option>Trà Hoa Quả Nhiệt Đới - 25K</option>
                <option>Chanh Xí Muội - 20K</option>
                <option>Rau Má Tươi - 20K</option>
            </select>

            <label for="quantity">Số lượng</label>
            <input
                type="number"
                id="quantity"
                min="1"
                value="1"
                required
            >

            <label for="topping">Topping</label>
            <select id="topping">
                <option>Không thêm topping</option>
                <option>Thạch dừa +5K</option>
                <option>Trân châu +5K</option>
            </select>

            <label for="address">Địa chỉ nhận hàng</label>
            <textarea
                id="address"
                placeholder="Nhập địa chỉ nhận hàng"
                required
            ></textarea>

            <label for="note">Ghi chú</label>
            <textarea
                id="note"
                placeholder="Ví dụ: ít đá, ít ngọt..."
            ></textarea>

            <button class="submit-button" type="submit">
                 XÁC NHẬN ĐẶT MÓN
            </button>

        </form>

    </div>

</div>


<script>

function openOrder() {
    document.getElementById("orderModal").style.display = "block";
}

function closeOrder() {
    document.getElementById("orderModal").style.display = "none";
}

window.onclick = function(event) {
    const modal = document.getElementById("orderModal");

    if (event.target === modal) {
        modal.style.display = "none";
    }
}

function submitOrder(event) {

    event.preventDefault();

    const name = document.getElementById("name").value;
    const phone = document.getElementById("phone").value;
    const drink = document.getElementById("drink").value;
    const quantity = document.getElementById("quantity").value;
    const topping = document.getElementById("topping").value;
    const address = document.getElementById("address").value;
    const note = document.getElementById("note").value;

    alert(
        "Đã nhận thông tin đặt món! \n\n" +
        "Tên: " + name +
        "\nSĐT: " + phone +
        "\nMón: " + drink +
        "\nSố lượng: " + quantity +
        "\nTopping: " + topping +
        "\nĐịa chỉ: " + address +
        "\nGhi chú: " + note
    );
}

</script>

</body>
</html>
